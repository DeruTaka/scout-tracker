<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PS Team Scouter — Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#f4f5fa; --surface:#ffffff; --surface-2:#fafbfd; --sidebar:#ffffff;
    --text:#161923; --muted:#727a8c; --line:#e9ebf2; --line-2:#f0f2f7;
    --accent:#6c5ce7; --accent-2:#8b7bff; --accent-soft:rgba(108,92,231,.10);
    --good:#12b886; --good-soft:rgba(18,184,134,.12); --danger:#ef4655; --danger-soft:rgba(239,70,85,.12);
    --shadow-sm:0 1px 2px rgba(20,23,40,.06); --shadow:0 8px 30px -12px rgba(30,34,60,.22);
    --radius:16px; --radius-sm:11px;
    --sans:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --display:'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --bg:#0c0e13; --surface:#14171f; --surface-2:#191d27; --sidebar:#101219;
    --text:#e8eaf1; --muted:#8b93a7; --line:#242a37; --line-2:#1d222d;
    --accent:#7c6dff; --accent-2:#9d8dff; --accent-soft:rgba(124,109,255,.16);
    --good-soft:rgba(18,184,134,.16); --danger-soft:rgba(239,70,85,.18);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 12px 34px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme=dark] {
    --bg:#0c0e13; --surface:#14171f; --surface-2:#191d27; --sidebar:#101219;
    --text:#e8eaf1; --muted:#8b93a7; --line:#242a37; --line-2:#1d222d;
    --accent:#7c6dff; --accent-2:#9d8dff; --accent-soft:rgba(124,109,255,.16);
    --good-soft:rgba(18,184,134,.16); --danger-soft:rgba(239,70,85,.18);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 12px 34px -14px rgba(0,0,0,.6);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  h1, .brand .name, .tc-head .player, .empty h3 { font-family:var(--display); }
  h1 { letter-spacing:-.02em; }

  .app { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
  .sidebar { position:sticky; top:0; height:100vh; background:var(--sidebar); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 16px; gap:8px; }
  .brand { display:flex; align-items:center; gap:11px; padding:6px 8px 14px; }
  .brand .logo { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:#fff; font-size:19px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 6px 16px -6px var(--accent); }
  .brand .name { font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .brand .name small { display:block; font-weight:500; font-size:11px; color:var(--muted); }
  .nav-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:10px 10px 4px; }
  nav { display:flex; flex-direction:column; gap:3px; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:11px; color:var(--muted); font-weight:500; transition:background .16s, color .16s; }
  .nav-item svg { width:18px; height:18px; }
  .nav-item:hover { background:var(--line-2); color:var(--text); text-decoration:none; }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }

  .main { display:flex; flex-direction:column; min-width:0; }
  .topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px; padding:20px 30px;
    background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .topbar h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; }
  .topbar .subtitle { margin:2px 0 0; font-size:13px; color:var(--muted); }
  .icon-btn { margin-left:auto; width:38px; height:38px; display:grid; place-items:center; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); cursor:pointer; transition:all .16s; }
  .icon-btn:hover { color:var(--text); border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
  .icon-btn svg { width:18px; height:18px; }
  .content { padding:26px 30px 60px; max-width:1180px; width:100%; margin:0 auto; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
  .toolbar { padding:16px 18px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding-left:2px; }
  input[type=text], select { background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; font-size:13.5px; font-family:inherit; transition:border-color .16s, box-shadow .16s; }
  input[type=text] { min-width:170px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .field.grow { flex:1 1 200px; }
  .field.grow input { width:100%; }
  .count { margin-left:auto; align-self:flex-end; color:var(--muted); font-size:12.5px; padding-bottom:9px; white-space:nowrap; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; }
  .team-card { padding:18px; display:flex; flex-direction:column; gap:12px; animation:rise .3s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .tc-head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .tc-head .player { font-weight:700; font-size:15px; letter-spacing:-.01em; }
  .badge { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; font-size:11px; font-weight:700; }
  .badge-win { background:var(--good-soft); color:var(--good); }
  .badge-loss { background:var(--danger-soft); color:var(--danger); }
  .tc-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:12px; }
  .chip { display:inline-flex; align-items:center; font-size:11px; font-weight:500; padding:2px 9px; border-radius:20px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--muted); }
  .mons { display:flex; flex-wrap:wrap; gap:7px; }
  .mon-chip { display:inline-flex; align-items:center; font-size:12px; font-weight:600; padding:5px 11px; border-radius:9px;
    background:var(--accent-soft); color:var(--accent); border:1px solid transparent; cursor:pointer; transition:transform .12s; }
  .mon-chip:hover { transform:translateY(-1px); }
  .mon-chip.unrevealed { background:transparent; color:var(--muted); border:1px dashed var(--line); font-weight:500; cursor:default; }
  .mon-chip.unrevealed:hover { transform:none; }
  .tc-foot { display:flex; align-items:center; gap:10px; margin-top:2px; }
  button { font-family:inherit; font-size:12px; font-weight:600; border-radius:8px; padding:6px 12px; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--text); transition:all .14s; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  .tc-foot a { font-size:12px; margin-left:auto; }
  details.paste-toggle summary { cursor:pointer; color:var(--muted); font-size:12px; list-style:none; }
  details.paste-toggle summary::-webkit-details-marker { display:none; }
  details.paste-toggle summary::before { content:'❯'; display:inline-block; margin-right:6px; font-size:10px; transition:transform .15s; }
  details.paste-toggle[open] summary::before { transform:rotate(90deg); }
  pre.paste { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:12px; overflow:auto;
    font:12px/1.5 var(--mono); white-space:pre; max-height:320px; margin:9px 0 0; }
  .empty { text-align:center; padding:54px 20px; color:var(--muted); }
  .empty h3 { color:var(--text); margin:0 0 4px; }
  .loading { color:var(--muted); padding:24px; }

  @media (max-width:720px){
    .app { grid-template-columns:1fr; }
    .sidebar { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px 14px; }
    .nav-label { display:none; } nav { flex-direction:row; }
    .topbar, .content { padding-left:16px; padding-right:16px; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">⚔️</div>
      <div class="name">Team Scouter<small>Showdown replay intel</small></div>
    </div>
    <div class="nav-label">Workspace</div>
    <nav>
      <a class="nav-item" href="/#scout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Scout
      </a>
      <a class="nav-item" href="/#library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        User sets
      </a>
      <a class="nav-item active" href="/teams">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        Teams
      </a>
      <a class="nav-item" href="/sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Sheet
      </a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>All teams</h1>
        <p class="subtitle">Every scouted team — search and sort across replays</p>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
    </header>

    <div class="content">
      <div class="card toolbar">
        <div class="field grow"><label>Trainer</label><input type="text" id="qUser" placeholder="Search username…" /></div>
        <div class="field grow"><label>Pokémon</label><input type="text" id="qMon" placeholder="e.g. Kyogre…" /></div>
        <div class="field"><label>Metagame</label><select id="qMeta"><option value="">All</option></select></div>
        <div class="field"><label>Sort by</label><select id="qSort">
          <option value="date-desc">Date (newest)</option>
          <option value="date-asc">Date (oldest)</option>
          <option value="meta">Metagame</option>
          <option value="trainer">Trainer (A–Z)</option>
          <option value="mon">Pokémon (A–Z)</option>
        </select></div>
        <div class="count" id="count"></div>
      </div>
      <div id="list"><div class="loading">loading teams…</div></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Theme */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
function currentTheme(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); }
function paintThemeBtn(){ $('themeBtn').innerHTML = currentTheme() === 'dark' ? SUN : MOON; }
function toggleTheme(){ const next = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('theme', next); paintThemeBtn(); }
(function(){ const s = localStorage.getItem('theme'); if (s) document.documentElement.dataset.theme = s; })();
$('themeBtn').onclick = toggleTheme;
paintThemeBtn();

let ALL = [];

function wireCopy(scope){
  scope.querySelectorAll('button[data-paste]').forEach((b)=>{
    b.onclick = () => { navigator.clipboard.writeText(decodeURIComponent(b.dataset.paste)); const t=b.textContent; b.textContent='Copied!'; setTimeout(()=>b.textContent=t,1200); };
  });
}

function teamCard(t){
  const badge = t.result ? `<span class="badge ${t.result==='W'?'badge-win':'badge-loss'}" title="${t.result==='W'?'Won':'Lost'}">${t.result}</span>` : '';
  const mons = t.mons.map((m)=> m.unrevealed
    ? `<span class="mon-chip unrevealed" title="Never appeared in the replay">${esc(m.species)}</span>`
    : `<span class="mon-chip" data-mon="${esc(m.species)}">${esc(m.species)}</span>`).join('');
  return `<div class="team-card card">
    <div class="tc-head"><span class="player">${esc(t.player)}</span>${badge}<span class="chip">${esc(t.format)}</span></div>
    <div class="tc-meta">${esc(t.date||'—')} · <a href="${esc(t.url)}" target="_blank">${esc(t.replayId)}</a>${t.winner?(' · winner: '+esc(t.winner)):''}</div>
    <div class="mons">${mons}</div>
    <div class="tc-foot">
      <button data-paste="${encodeURIComponent(t.paste)}">Copy paste</button>
      <details class="paste-toggle"><summary>Show paste</summary></details>
    </div>
    <div class="paste-holder"></div>
  </div>`;
}

function render(){
  const qUser = $('qUser').value.trim().toLowerCase();
  const qMon = $('qMon').value.trim().toLowerCase();
  const qMeta = $('qMeta').value;
  const sort = $('qSort').value;

  let rows = ALL.filter((t)=>{
    if (qUser && !t.player.toLowerCase().includes(qUser)) return false;
    if (qMeta && t.formatid !== qMeta) return false;
    if (qMon && !t.mons.some((m)=> m.species.toLowerCase().includes(qMon))) return false;
    return true;
  });

  const firstMon = (t)=> (t.mons[0] && t.mons[0].species || '').toLowerCase();
  rows.sort((a,b)=>{
    switch (sort) {
      case 'date-asc': return a.uploadtime - b.uploadtime;
      case 'meta': return a.format.localeCompare(b.format) || b.uploadtime - a.uploadtime;
      case 'trainer': return a.player.localeCompare(b.player) || b.uploadtime - a.uploadtime;
      case 'mon': return firstMon(a).localeCompare(firstMon(b)) || b.uploadtime - a.uploadtime;
      default: return b.uploadtime - a.uploadtime; // date-desc
    }
  });

  $('count').textContent = `${rows.length} of ${ALL.length} team${ALL.length===1?'':'s'}`;
  const list = $('list');
  if (!rows.length) { list.innerHTML = `<div class="card empty"><h3>No teams match</h3><div>Try clearing the filters, or scout a replay first.</div></div>`; return; }
  list.innerHTML = `<div class="grid">${rows.map(teamCard).join('')}</div>`;

  // Attach paste + copy behavior, and make mon chips filter.
  list.querySelectorAll('.team-card').forEach((card, i)=>{
    const t = rows[i];
    const det = card.querySelector('details.paste-toggle');
    det.addEventListener('toggle', ()=>{
      if (det.open && !det.dataset.filled) {
        card.querySelector('.paste-holder').innerHTML = `<pre class="paste">${esc(t.paste)}</pre>`;
        det.dataset.filled = '1';
      }
    });
  });
  list.querySelectorAll('.mon-chip[data-mon]').forEach((c)=>{
    c.onclick = () => { $('qMon').value = c.dataset.mon; render(); };
  });
  wireCopy(list);
}

async function load(){
  let data; try { data = await (await fetch('/api/teams')).json(); } catch { data = { teams: [] }; }
  ALL = data.teams || [];
  const metas = [...new Set(ALL.map((t)=>t.formatid))]
    .map((id)=>({ id, label: (ALL.find((t)=>t.formatid===id)||{}).format || id }))
    .sort((a,b)=>a.label.localeCompare(b.label));
  $('qMeta').innerHTML = '<option value="">All metagames</option>' + metas.map((m)=>`<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('');
  if (!ALL.length) { $('list').innerHTML = `<div class="card empty"><h3>No teams stored yet</h3><div>Scout a replay on the <a href="/#scout">Scout page</a> to populate this.</div></div>`; $('count').textContent=''; return; }
  render();
}

['qUser','qMon'].forEach((id)=> $(id).addEventListener('input', ()=>{ clearTimeout(window._t); window._t = setTimeout(render, 200); }));
['qMeta','qSort'].forEach((id)=> $(id).addEventListener('change', render));
load();
</script>
</body>
</html>
