<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PS Team Scouter — Sheet</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --muted:#9aa3b2; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; display:flex; flex-direction:column; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; flex:0 0 auto; }
  header h1 { font-size:18px; margin:0; }
  header a { color:var(--accent); text-decoration:none; }
  header a:hover { text-decoration:underline; }
  header .nav { margin-left:auto; display:flex; gap:14px; }
  main { flex:1 1 auto; display:flex; min-height:0; }
  .frame-wrap { flex:1 1 auto; padding:12px; min-height:0; }
  iframe { width:100%; height:100%; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .empty { max-width:640px; margin:40px auto; padding:0 20px; color:var(--muted); }
  .empty h2 { color:var(--text); }
  code { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font:12px/1.4 ui-monospace, monospace; }
  .loading { color:var(--muted); padding:20px; }
</style>
</head>
<body>
<header>
  <h1>📊 Scouted Sheet</h1>
  <nav class="nav">
    <a href="/">← Scouter</a>
  </nav>
</header>
<main id="main">
  <div class="loading" id="loading">loading sheet…</div>
</main>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  let s;
  try { s = await (await fetch('/api/status')).json(); }
  catch { s = {}; }
  const main = document.getElementById('main');
  if (s.sheetEmbedUrl) {
    main.innerHTML = `<div class="frame-wrap"><iframe src="${esc(s.sheetEmbedUrl)}" title="Scouted sets sheet" loading="lazy"></iframe></div>`;
  } else {
    main.innerHTML = `<div class="empty">
      <h2>No sheet configured yet</h2>
      <p>To show the live sheet here, set one of these in your <code>.env</code> and restart:</p>
      <ul>
        <li><code>SHEET_EMBED_URL</code> — the <em>src</em> from the sheet's
          <strong>File → Share → Publish to web → Embed</strong> (most reliable), or</li>
        <li><code>SHEET_ID</code> — the id from the sheet URL. The page will embed
          <code>/htmlembed</code>, which requires the sheet be shared
          <strong>“anyone with the link”</strong>.</li>
      </ul>
      <p>The sheet itself is written by <code>Scout &amp; update sheet</code> on the
        <a href="/">Scouter page</a> when Google Sheets is configured.</p>
    </div>`;
  }
}
load();
</script>
</body>
</html>
