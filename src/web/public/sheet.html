<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PS Team Scouter — Sheet</title>
<style>
  :root {
    --bg:#f4f5fa; --surface:#ffffff; --surface-2:#fafbfd; --sidebar:#ffffff;
    --text:#161923; --muted:#727a8c; --line:#e9ebf2; --line-2:#f0f2f7;
    --accent:#6c5ce7; --accent-2:#8b7bff; --accent-soft:rgba(108,92,231,.10);
    --good:#12b886; --good-soft:rgba(18,184,134,.12);
    --shadow-sm:0 1px 2px rgba(20,23,40,.06); --shadow:0 8px 30px -12px rgba(30,34,60,.22);
    --radius:16px; --radius-sm:11px;
    --sans:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --bg:#0c0e13; --surface:#14171f; --surface-2:#191d27; --sidebar:#101219;
    --text:#e8eaf1; --muted:#8b93a7; --line:#242a37; --line-2:#1d222d;
    --accent:#7c6dff; --accent-2:#9d8dff; --accent-soft:rgba(124,109,255,.16); --good-soft:rgba(18,184,134,.16);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 12px 34px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme=dark] {
    --bg:#0c0e13; --surface:#14171f; --surface-2:#191d27; --sidebar:#101219;
    --text:#e8eaf1; --muted:#8b93a7; --line:#242a37; --line-2:#1d222d;
    --accent:#7c6dff; --accent-2:#9d8dff; --accent-soft:rgba(124,109,255,.16); --good-soft:rgba(18,184,134,.16);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 12px 34px -14px rgba(0,0,0,.6);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  code { background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font:12px/1.4 var(--mono); }

  .app { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
  .sidebar { position:sticky; top:0; height:100vh; background:var(--sidebar); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 16px; gap:8px; }
  .brand { display:flex; align-items:center; gap:11px; padding:6px 8px 14px; }
  .brand .logo { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:#fff; font-size:19px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 6px 16px -6px var(--accent); }
  .brand .name { font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .brand .name small { display:block; font-weight:500; font-size:11px; color:var(--muted); }
  .nav-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:10px 10px 4px; }
  nav { display:flex; flex-direction:column; gap:3px; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:11px; color:var(--muted); font-weight:500; transition:background .16s, color .16s; }
  .nav-item svg { width:18px; height:18px; }
  .nav-item:hover { background:var(--line-2); color:var(--text); text-decoration:none; }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }

  .main { display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; gap:16px; padding:20px 30px; border-bottom:1px solid var(--line); }
  .topbar h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; }
  .topbar .subtitle { margin:2px 0 0; font-size:13px; color:var(--muted); }
  .icon-btn { margin-left:auto; width:38px; height:38px; display:grid; place-items:center; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); cursor:pointer; transition:all .16s; }
  .icon-btn:hover { color:var(--text); border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
  .icon-btn svg { width:18px; height:18px; }

  .content { flex:1 1 auto; display:flex; min-height:0; padding:20px 30px 30px; }
  .frame-card { flex:1 1 auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden; display:flex; }
  iframe { flex:1 1 auto; width:100%; border:0; background:#fff; }
  .empty { max-width:640px; margin:36px auto; }
  .empty .ico { width:56px; height:56px; margin:0 auto 16px; border-radius:16px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
  .empty .ico svg { width:28px; height:28px; }
  .empty h2 { text-align:center; margin:0 0 6px; }
  .empty p, .empty li { color:var(--muted); }
  .loading { color:var(--muted); padding:24px; }

  @media (max-width:720px){
    .app { grid-template-columns:1fr; }
    .sidebar { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px 14px; }
    .nav-label { display:none; } nav { flex-direction:row; }
    .topbar, .content { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">⚔️</div>
      <div class="name">Team Scouter<small>Showdown replay intel</small></div>
    </div>
    <div class="nav-label">Workspace</div>
    <nav>
      <a class="nav-item" href="/#scout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Scout
      </a>
      <a class="nav-item" href="/#library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Library
      </a>
      <a class="nav-item active" href="/sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Sheet
      </a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>Scouted sheet</h1>
        <p class="subtitle">The live library of unique sets, embedded</p>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
    </header>
    <div class="content" id="content">
      <div class="loading">loading sheet…</div>
    </div>
  </div>
</div>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
function currentTheme(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); }
function paintThemeBtn(){ document.getElementById('themeBtn').innerHTML = currentTheme() === 'dark' ? SUN : MOON; }
function toggleTheme(){ const next = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('theme', next); paintThemeBtn(); }
(function(){ const s = localStorage.getItem('theme'); if (s) document.documentElement.dataset.theme = s; })();
document.getElementById('themeBtn').onclick = toggleTheme;
paintThemeBtn();

async function load() {
  let s; try { s = await (await fetch('/api/status')).json(); } catch { s = {}; }
  const content = document.getElementById('content');
  if (s.sheetEmbedUrl) {
    content.innerHTML = `<div class="frame-card"><iframe src="${esc(s.sheetEmbedUrl)}" title="Scouted sets sheet" loading="lazy"></iframe></div>`;
  } else {
    content.innerHTML = `<div class="empty">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></div>
      <h2>No sheet configured yet</h2>
      <p>To show the live sheet here, set one of these in your <code>.env</code> and restart:</p>
      <ul>
        <li><code>SHEET_EMBED_URL</code> — the <em>src</em> from the sheet's
          <strong>File → Share → Publish to web → Embed</strong> (most reliable), or</li>
        <li><code>SHEET_ID</code> — the id from the sheet URL. The page embeds
          <code>/htmlembed</code>, which needs the sheet shared <strong>“anyone with the link”</strong>.</li>
      </ul>
      <p>The sheet is written by <strong>Scout &amp; update sheet</strong> on the
        <a href="/#scout">Scout page</a> when Google Sheets is configured.</p>
    </div>`;
  }
}
load();
</script>
</body>
</html>
